<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Automator</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; background: #f4f4f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f8f8; }
        button { background: #7c3aed; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; }
        button:hover { background: #5e2a9c; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Invoice Automator API</h1>
    <p>This UI is connected to your Node.js + PostgreSQL backend.</p>
    
    <div style="margin-bottom: 2rem;">
        <input type="file" id="fileInput" />
        <button onclick="uploadInvoice()">Upload Invoice</button>
    </div>

    <h2>Recent Invoices</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Supplier</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="invoiceTable">
            <!-- Data will be loaded here -->
        </tbody>
    </table>
</div>

<script>
    // 1. Fetch and display invoices
    async function loadInvoices() {
        const response = await fetch('/api/invoices');
        const data = await response.json();
        
        const table = document.getElementById('invoiceTable');
        table.innerHTML = ''; // Clear table

        data.invoices.forEach(invoice => {
            table.innerHTML += `
                <tr>
                    <td>${invoice.id}</td>
                    <td>${invoice.supplier_name}</td>
                    <td>€${invoice.amount}</td>
                    <td><strong>${invoice.status}</strong></td>
                    <td>
                        <button onclick="syncInvoice(${invoice.id})">Sync to Exact</button>
                    </td>
                </tr>
            `;
        });
    }

    // 2. Upload a file
    async function uploadInvoice() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) return alert('Choose a file first!');

        const formData = new FormData();
        formData.append('invoice', fileInput.files[0]);

        await fetch('/api/upload-invoice', {
            method: 'POST',
            body: formData
        });

        alert('Invoice Uploaded!');
        loadInvoices(); // Refresh the table
    }

    // 3. Sync invoice to Exact (Mock)
    async function syncInvoice(id) {
        await fetch(`/api/invoices/${id}/sync`, { method: 'POST' });
        loadInvoices(); // Refresh the table
    }

    // Load invoices when page opens
    loadInvoices();
</script>

</body>
</html>
